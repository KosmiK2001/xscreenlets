<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- minimal theme: только корпус батарейки, без рамки и без блика.
     Размер 76x37 = AB_BODY_W x AB_BODY_H, как и в теме green, поэтому
     applet рисует её в те же координаты и ничего не сдвигается.

     Контуры - currentColor нет, поэтому цвет задан явно. Обводка идёт
     ВНУТРЬ фигуры (x=1, width=74 при общей ширине 76), иначе half
     пикселя обводки уходил бы за границу спрайта и обрезался. -->
<svg xmlns="http://www.w3.org/2000/svg" width="76" height="37"
     viewBox="0 0 76 37">
  <!-- Вывод (+) справа. Ширина 4, высота 11, по центру по вертикали. -->
  <rect x="70" y="13" width="4" height="11" rx="1.2"
        fill="#5A6169"/>
  <!-- Корпус. rx=4 согласован с формой окна: у темы без фона скругление
       окна всё равно применяется через corner_radius. -->
  <rect x="1" y="4" width="68" height="29" rx="4"
        fill="#2A2E33" stroke="#7C848C" stroke-width="1"/>
</svg>