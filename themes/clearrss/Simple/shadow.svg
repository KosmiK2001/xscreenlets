<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" version="1.1"
     width="600" height="600" viewBox="0 0 600 600">
<!-- Круглая тень кнопок для темы Simple.
     В исходном background.svg тени не было: три path (path2270, path3260,
     path3264) имели fill:none и stroke:#ffffff, то есть были только
     КОНТУРАМИ. Заливки, которую можно масштабировать, в файле не
     находилось, поэтому "растянутые тени под кнопками" на самом деле были
     этими контурами, увеличенными по вертикали вчетверо: тема
     растягивается в прямоугольник шириной w и высотой 2*(h-header)
     (clearrss.c), а Simple рисуется из диапазона y=100..200.
     Здесь настоящая заливка с радиальным градиентом: ореол одинаков со
     всех сторон, острием не читается.
     width/height в px обязательно: theme_draw_full в core/common.c
     принимает только RSVG_UNIT_PX. -->
<defs>
  <radialGradient id="btnShadow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0"    style="stop-color:#000000;stop-opacity:0.39158576" />
    <stop offset="0.72" style="stop-color:#000000;stop-opacity:0.34" />
    <stop offset="1"    style="stop-color:#000000;stop-opacity:0" />
  </radialGradient>
</defs>
<circle cx="300" cy="300" r="300" fill="url(#btnShadow)" />
</svg>
