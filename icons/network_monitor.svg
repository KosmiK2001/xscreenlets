<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Глобус с сигналом: аплет NetworkMonitor -->
  <g>
    <!-- земной шар -->
    <circle cx="32" cy="32" r="19" fill="#5382BA" stroke="#2C5B85" stroke-width="2"/>
    <!-- сетка: меридианы и параллели, обрезанные по кругу -->
    <g fill="none" stroke="#EAF4FB" stroke-width="1.6" opacity="0.85">
      <ellipse cx="32" cy="32" rx="8" ry="19"/>
      <ellipse cx="32" cy="32" rx="15" ry="19"/>
      <line x1="13" y1="32" x2="51" y2="32"/>
      <path d="M 15.2 21.5 A 19 19 0 0 1 48.8 21.5"/>
      <path d="M 15.2 42.5 A 19 19 0 0 0 48.8 42.5"/>
    </g>
    <!-- блик на шаре -->
    <ellipse cx="24" cy="23" rx="7" ry="4.5" fill="#ffffff" opacity="0.28"
             transform="rotate(-32 24 23)"/>
    <!-- дуга сигнала, две волны -->
    <g fill="none" stroke="#FFA500" stroke-width="3.2" stroke-linecap="round">
      <path d="M 44 20 A 14 14 0 0 1 44 44"/>
      <path d="M 51 13 A 24 24 0 0 1 51 51"/>
    </g>
    <!-- точка-источник сигнала -->
    <circle cx="44" cy="32" r="3" fill="#FFA500"/>
  </g>
</svg>